# fly.toml app configuration file generated for cord-backend on 2026-09-20T12:48:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cord-backend'
primary_region = 'sin'

[build]
  [build.args]
    GO_VERSION = '1.26.1'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
